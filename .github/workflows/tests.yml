name: tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show Chrome version
        run: google-chrome --version

      - name: Run Selenide + API tests
        env:
          SOLIDGATE_PUBLIC_KEY: ${{ secrets.SOLIDGATE_PUBLIC_KEY }}
          SOLIDGATE_SECRET_KEY: ${{ secrets.SOLIDGATE_SECRET_KEY }}
          SOLIDGATE_SUCCESS_CARD_NUMBER: '4067429974719265'
          SOLIDGATE_SUCCESS_CARD_EXPIRY: '12/30'
          SOLIDGATE_SUCCESS_CARD_CVV: '123'
          SOLIDGATE_SUCCESS_CARD_HOLDER: 'QA Tester'
        run: ./mvnw -B -ntp test -Pheadless

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            build/reports/
            build/downloads/
          if-no-files-found: ignore
          retention-days: 7
